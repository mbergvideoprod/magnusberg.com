/* ===== pager: its own scroller, one slide = one screen, one swipe = one slide ===== */
.pager{height:100vh;height:100dvh;width:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}

              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span class="a-type" style="width: fit-content; font-family: 'Poppins', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #2A2A2A; animation-delay: 1.35s">&gt; YouTube</span>
                <span class="c-val a-up" style="font-size: 15px; font-weight: 800; font-stretch: 100%; text-transform: uppercase; white-space: nowrap; animation-delay: 1.45s">[Showreel]</span>

  <!-- "Email copied" notice (hidden unless the script shows it) -->
  <div class="toast" role="status" aria-live="polite" style="position: fixed; left: 50%; bottom: 28px; z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: #111111; color: #E6E6E6; font-family: 'Poppins', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.35); pointer-events: none">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M2 7.5L5.5 11L12 3.5" fill="none" stroke="#E6E6E6" stroke-width="1.6"></path></svg>
    <span>Email copied</span>

<script>
(function () {
  var EMAIL = 'mbergvideoprod@gmail.com';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mount(hostId, tplId) {
    var host = document.getElementById(hostId);
    var root = host.attachShadow({ mode: 'open' });
    root.appendChild(document.getElementById(tplId).content.cloneNode(true));
    return root;
  }

  // copy email -> "Email copied" notice; if copying is impossible, open the mail app
  function wireEmail(root) {
    var toast = root.querySelector('.toast');
    var timer;
    function show() {
      if (!toast) return;
      toast.classList.remove('show');
      void toast.offsetWidth;            // restart the animation
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove('show'); }, 2500);
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = EMAIL; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { show(); return; }
      } catch (e) {}
      window.location.href = 'mailto:' + EMAIL;
    }
    root.querySelectorAll('a[href^="mailto:"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(EMAIL).then(show, fallback);
        } else { fallback(); }
      });
    });
  }

  // ================= DESKTOP =================
  var desk = mount('desk', 'desk-tpl');
  (function () {
    var rootEl = desk.querySelector('.root');
    rootEl.classList.add('anim');

    // reveal each scene when it scrolls into view
    var targets = desk.querySelectorAll('[data-rv]');
    var fired = false;
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        fired = true;
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { threshold: 0.18 });
      targets.forEach(function (t) { io.observe(t); });
      setTimeout(function () { if (!fired) targets.forEach(function (t) { t.classList.add('in'); }); }, 1500);
    } else { targets.forEach(function (t) { t.classList.add('in'); }); }

    // parallax + scene transitions
    if (!reduce) {
      var raf = 0;
      var scenes = desk.querySelectorAll('[data-px]');
      var update = function () {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          raf = 0;
          var vh = window.innerHeight || 1;
          scenes.forEach(function (el) {
            var r = el.getBoundingClientRect();
            var p = (r.top + r.height / 2 - vh / 2) / (vh / 2 + r.height / 2);
            p = Math.max(-1, Math.min(1, p));
            el.style.setProperty('--p', p.toFixed(4));
            el.style.setProperty('--a', Math.abs(p).toFixed(4));
            el.style.setProperty('--pin', Math.max(0, p).toFixed(4));
          });
        });
      };
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();
    }

    // in-page links (#info, #contact, #top) live inside the shadow root -> scroll to them ourselves
    desk.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var t = desk.getElementById(a.getAttribute('href').slice(1));
        if (!t) return;
        e.preventDefault();
        t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
    });

    wireEmail(desk);
  })();

  // ================= PHONE =================
  var mob = mount('mob', 'mob-tpl');
  (function () {
    var rootEl = mob.querySelector('.root');
    rootEl.classList.add('anim');
    var pager = mob.querySelector('.pager');
    var slides = mob.querySelectorAll('[data-slide]');
    var dots = mob.querySelectorAll('.dot');
    var dotNav = mob.querySelector('nav[aria-label="Pages"]');

    function goTo(i) {
      if (!slides[i]) return;
      pager.scrollTo({ top: slides[i].offsetTop, behavior: reduce ? 'auto' : 'smooth' });
    }
    mob.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.preventDefault(); goTo(+b.getAttribute('data-go')); });
    });

    var raf = 0, cur = -1;
    function update() {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = 0;
        var pr = pager.getBoundingClientRect();
        var h = pr.height || 1;
        var best = 0, bestD = 1e9;
        slides.forEach(function (s, i) {
          var v = (s.getBoundingClientRect().top - pr.top) / h;
          var c = Math.max(-1, Math.min(1, v));
          if (!reduce) {
            s.style.setProperty('--p', c.toFixed(4));
            s.style.setProperty('--a', Math.abs(c).toFixed(4));
            s.style.setProperty('--pin', Math.max(0, c).toFixed(4));
          }
          if (Math.abs(v) < 0.45) s.classList.add('in');
          if (Math.abs(v) < bestD) { bestD = Math.abs(v); best = i; }
        });
        if (best !== cur) {
          cur = best;
          dots.forEach(function (d, i) { d.classList.toggle('on', i === cur); });
          if (dotNav) dotNav.style.color = cur === 2 ? '#111111' : '#E6E6E6';
        }
      });
    }
    pager.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();

    wireEmail(mob);
  })();
})();
</script>
